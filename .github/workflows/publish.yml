name: Publish to npm + GitHub Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every gate, pack and clean-install, but do not push the version bump or publish
        type: boolean
        default: true
  push:
    branches: [master]

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, version, publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      # Every step from here to the publish is blocking. A red step stops the
      # job before the version bump is pushed and before anything reaches npm.
      - name: Unit tests
        run: pnpm exec vitest run
        env:
          CI: true

      - name: Integration tests
        run: pnpm run test:integration
        env:
          CI: true

      # The quarantined files do not block by failing. They block when a test
      # in them that used to pass stops passing.
      - name: Quarantined tests (regressions block)
        run: |
          pnpm exec vitest run --config vitest.quarantined.config.ts --reporter=json --outputFile="$RUNNER_TEMP/quarantine-report.json" || true
          node scripts/quarantine-report.mjs "$RUNNER_TEMP/quarantine-report.json"
        env:
          CI: true

      - name: Smoke the built dist under plain Node
        run: node scripts/smoke-dist.mjs

      - name: Determine version bump from commits
        id: bump
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" --no-merges -50)
          else
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s" --no-merges)
          fi

          if [ -z "$COMMITS" ]; then
            echo "bump=none" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            echo "No new commits since last tag"
            exit 0
          fi

          BUMP="none"
          if echo "$COMMITS" | grep -qiE "BREAKING[ _-]CHANGE|^[a-z]+(\(.+\))?!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qiE "^(fix|perf|refactor)(\(.+\))?:"; then
            BUMP="patch"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

          if [ "$BUMP" != "none" ]; then
            CURRENT=$(node -p "require('./package.json').version")
            # A version that is already on npm is never reused. An earlier run
            # can have published and then failed to push its bump, which leaves
            # package.json behind the registry.
            PUBLISHED=$(npm view wunderland version 2>/dev/null || true)
            if [ -n "$PUBLISHED" ]; then
              HIGHEST=$(printf '%s\n%s\n' "$CURRENT" "$PUBLISHED" | sort -V | tail -n 1)
              if [ "$HIGHEST" != "$CURRENT" ]; then
                echo "::warning::npm has wunderland $PUBLISHED but package.json has $CURRENT; versioning from $PUBLISHED"
                CURRENT="$PUBLISHED"
              fi
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major)
                if [ "$MAJOR" -eq 0 ]; then
                  # Pre-1.0: breaking changes are minor bumps within 0.x
                  # Reserve major bump (and 1.0.0) for the official launch
                  MINOR=$((MINOR + 1)); PATCH=0
                else
                  MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
                fi
                ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "Bump: $BUMP ($CURRENT → $NEW_VERSION)"
          else
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            echo "No semantic bump needed"
          fi

      # The bump is committed locally here and pushed only after the tarball
      # is on npm, so a failed gate or a failed publish leaves master untouched.
      - name: Set the release version (local commit)
        if: steps.bump.outputs.bump != 'none'
        run: |
          npm version ${{ steps.bump.outputs.version }} --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"

      # A dry run packs and installs the current version when no bump is due,
      # so the packaging gates can be exercised on any commit.
      - name: Resolve workspace protocol
        if: steps.bump.outputs.bump != 'none' || inputs.dry_run == true
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const g of ['dependencies','optionalDependencies','peerDependencies']) {
              if (!pkg[g]) continue;
              for (const [n,v] of Object.entries(pkg[g])) {
                if (String(v).startsWith('workspace:')) pkg[g][n] = '*';
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Pack the release tarball
        id: pack
        if: steps.bump.outputs.bump != 'none' || inputs.dry_run == true
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          TARBALL="$(ls "$RUNNER_TEMP"/pack/*.tgz)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed $TARBALL"

      - name: Clean install of the tarball, then smoke the installed tree
        if: steps.bump.outputs.bump != 'none' || inputs.dry_run == true
        env:
          # The smoke imports modules; it never launches a browser.
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          PREFIX="$RUNNER_TEMP/clean-install"
          mkdir -p "$PREFIX"
          cd "$PREFIX"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "${{ steps.pack.outputs.tarball }}"
          INSTALLED="$(./node_modules/.bin/wunderland --version)"
          echo "Installed binary reports: $INSTALLED"
          echo "$INSTALLED" | grep -F "v${{ steps.bump.outputs.version }}"
          node "$GITHUB_WORKSPACE/scripts/smoke-dist.mjs" --root "$PREFIX/node_modules/wunderland"

      # npm first, master second. If the publish fails, master still holds the
      # old version and the next run retries the same release. If the push
      # fails after a publish, the run is red, the canary still checks the
      # registry copy (it is started before the push), and the next release
      # versions from what npm holds.
      # Only master publishes. A manual run on another ref can be a dry run
      # only: publishing from it would also push that ref's commits to master.
      - name: Publish the verified tarball to npm
        id: publish
        if: steps.bump.outputs.bump != 'none' && inputs.dry_run != true && github.ref == 'refs/heads/master'
        run: |
          npm publish "${{ steps.pack.outputs.tarball }}" --access public
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The canary's workflow_run trigger did not fire after 0.84.1 or 0.85.0,
      # so the publish job starts it directly, as soon as npm has the version.
      # A dispatch that still fails after the retries must not skip the
      # version-bump push; the run is failed at the end instead.
      - name: Start the post-publish canary
        id: canary
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run post-publish-canary.yml --ref master -f version="${{ steps.bump.outputs.version }}"; then
              exit 0
            fi
            echo "canary dispatch failed (attempt $attempt)"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Push the version bump
        if: steps.publish.outputs.published == 'true'
        run: |
          # Packing rewrote package.json in the working tree; only the commit is pushed.
          git reset --hard HEAD
          for attempt in 1 2 3 4; do
            if git push origin HEAD:master; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              break
            fi
            echo "master moved during the run; rebasing the version bump (attempt $attempt)"
            git fetch origin master
            # A rebase that stops on a conflict must not end the step here:
            # undo it and fall through to the error below.
            if ! git rebase origin/master; then
              git rebase --abort || true
              break
            fi
          done
          echo "::error::wunderland ${{ steps.bump.outputs.version }} is on npm but its version bump could not be pushed to master. The next release versions from npm."
          exit 1

      - name: Fail the run when the canary did not start
        if: steps.canary.outcome == 'failure'
        run: |
          echo "::error::wunderland ${{ steps.bump.outputs.version }} is on npm and master, but the post-publish canary could not be started. Start it by hand: gh workflow run post-publish-canary.yml --ref master -f version=${{ steps.bump.outputs.version }}"
          exit 1

      - name: Nothing to publish
        if: steps.publish.outputs.published != 'true'
        run: echo "No publish in this run (bump ${{ steps.bump.outputs.bump }}, dry run ${{ inputs.dry_run }}, ref ${{ github.ref }})"

  release:
    name: Create GitHub Release
    needs: publish
    # Tag and release whatever reached npm, even when a later step of the
    # publish job (the push of the version bump) failed.
    if: always() && needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          VERSION="v${{ needs.publish.outputs.version }}"

          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges | grep -v "\[skip ci\]")
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges -20 | grep -v "\[skip ci\]")
          fi

          cat > /tmp/changelog.md << MDEOF
          ## Changes

          ${CHANGES}

          ---
          Published to npm: [\`wunderland@${{ needs.publish.outputs.version }}\`](https://www.npmjs.com/package/wunderland/v/${{ needs.publish.outputs.version }})
          MDEOF

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ needs.publish.outputs.version }}"
          git tag "$VERSION" 2>/dev/null || true
          git push origin "$VERSION" 2>/dev/null || true
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file /tmp/changelog.md \
            --latest
